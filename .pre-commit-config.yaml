repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gen-code-notes
        name: regenerate docs/code Obsidian notes
        entry: python scripts/gen_code_notes.py --stage
        language: system
        files: ^src/.*\.py$
        pass_filenames: false
